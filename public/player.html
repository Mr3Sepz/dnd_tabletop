<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var t=localStorage.getItem("dnd.theme"),r=document.documentElement;if(/^(dark|crypt|steampunk|scifi|cyberpunk|retro|console)$/.test(t))r.dataset.theme="dark";if(/^(parchment|crypt|steampunk|scifi|cyberpunk|retro|console)$/.test(t))r.dataset.skin=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spieler – DnD-Tabletop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/themes.css">
</head>
<body class="player">
  <header class="topbar">
    <span class="brand" id="who">DnD-Tabletop</span>
    <span class="live-info" id="sceneName"></span>
    <span class="spacer"></span>
    <button class="icon" id="zoomOut" title="Verkleinern">−</button>
    <button class="icon" id="zoomFit" title="Ganze Karte">⤢</button>
    <button class="icon" id="zoomIn" title="Vergrößern">+</button>
    <button class="icon" id="worldBtn" title="Weltkarte">🌍</button>
    <button class="icon" id="mapToggle" title="Karte aus- oder einblenden (z. B. mit echter Karte auf dem Tisch oder am Handy)">🗺</button>
    <button class="icon" id="fullscreen" title="Vollbild (auch F11)">⛶</button>
    <span id="conn" class="conn" title="Verbindung"></span>
    <button class="small primary" id="panelToggle">Mein Charakter</button>
  </header>
  <div id="initiative" class="initiative"></div>
  <main class="layout">
    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="toolbar" class="toolbar" aria-label="Werkzeuge"></div>
    </div>
    <aside class="panel" id="panel">
      <nav class="tabs" id="tabs">
        <button data-tab="sheet" class="active">Charakter</button>
        <button data-tab="abilities">Attribute</button>
        <button data-tab="inventory">Inventar</button>
        <button data-tab="party">Gruppe</button>
      </nav>
      <div class="tab-body" id="sheet"></div>
      <div class="tab-body hidden" id="abilities"></div>
      <div class="tab-body hidden" id="inventory"></div>
      <div class="tab-body hidden" id="party"></div>
    </aside>
  </main>
  <div id="gone" class="login hidden"><div class="card"><h1 id="goneTitle"></h1><p id="goneMsg"></p><a class="button primary" href="/">Zur Platzwahl</a></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/konva.min.js"></script>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
