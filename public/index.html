<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var t=localStorage.getItem("dnd.theme"),r=document.documentElement;if(/^(dark|crypt|steampunk|scifi|cyberpunk|retro|console)$/.test(t))r.dataset.theme="dark";if(/^(parchment|crypt|steampunk|scifi|cyberpunk|retro|console)$/.test(t))r.dataset.skin=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beitreten – DnD-Tabletop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/themes.css">
</head>
<body class="join">
  <main class="card join-card">
    <div class="join-head"><h1>DnD-Tabletop</h1><span data-lang-switch></span></div>
    <div id="resume"></div>
    <p>Wähle deinen Platz:</p>
    <div id="seats" class="seats"></div>
    <form id="joinForm" class="hidden">
      <label class="field"><span>Dein Name</span><input name="playerName" maxlength="40" autocomplete="nickname" placeholder="z. B. Mia"></label>
      <fieldset class="field ping-colors" id="colorField"><legend>Deine Farbe (für Pings auf der Karte)</legend><div id="colors" class="color-choice"></div></fieldset>
      <label class="field" id="pinField"><span>Raum-PIN</span><input name="pin" inputmode="numeric" autocomplete="off" placeholder="vom DM"></label>
      <button class="primary" type="submit">Beitreten</button>
    </form>
    <p id="msg" class="error"></p>
    <p class="muted small"><a href="/dm">Ich bin der DM</a></p>
  </main>
  <script type="module">
    import { h } from '/js/util.js';
    import { storedSeat } from '/js/net.js';

    let chosen = null;
    const info = await fetch('/api/public-info').then((r) => r.json());
    const form = document.getElementById('joinForm');
    document.getElementById('pinField').classList.toggle('hidden', !info.pinRequired);

    const prev = storedSeat();
    if (prev && prev.claimToken) {
      document.getElementById('resume').append(
        h('a.button.primary.wide', { href: `/player?seat=${prev.seat}` }, `Weiter auf Platz ${prev.seat}`));
    }

    const seats = document.getElementById('seats');
    for (const s of info.seats) {
      const ch = info.characters.find((c) => c.seat === s.seat);
      const mine = prev && prev.seat === s.seat;
      const btn = h(`button.seat${s.taken && !mine ? '.taken' : ''}`, {
        type: 'button',
        disabled: s.taken && !mine,
        onclick: () => {
          if (mine) { location.href = `/player?seat=${s.seat}`; return; }
          chosen = s.seat;
          [...seats.children].forEach((b) => b.classList.toggle('selected', b === btn));
          form.classList.remove('hidden');
          form.elements.playerName.focus();
        },
      }, h('b', {}, `Platz ${s.seat}`), h('span', { 'data-raw': '' }, ch ? ch.name : ''), h('small', {}, s.taken ? (s.playerName || 'belegt') : 'frei'));
      seats.append(btn);
    }

    // Ping-Farben: jede nur einmal, wer zuerst kommt, bekommt sie
    const NAMES = { '#a71313': 'Rot', '#006D5B': 'Grün', '#2b53a7': 'Blau', '#d6a444': 'Gelb', '#e3ded5': 'Weiß' };
    const takenColors = new Set(info.seats.filter((s) => s.taken && s.color).map((s) => s.color.toLowerCase()));
    let color = null;
    const colors = document.getElementById('colors');
    for (const c of info.pingColors || []) {
      const taken = takenColors.has(c.toLowerCase());
      const b = h(`button.swatch${taken ? '.taken' : ''}`, {
        type: 'button', disabled: taken, dataset: { color: c }, style: { background: c },
        title: taken ? `${NAMES[c] || c} (schon vergeben)` : NAMES[c] || c, 'aria-label': NAMES[c] || c, 'aria-pressed': 'false',
        onclick: () => {
          color = c;
          for (const x of colors.children) { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); }
        },
      }, h('span', {}, NAMES[c] || ''));
      colors.append(b);
    }
    const free = (info.pingColors || []).filter((c) => !takenColors.has(c.toLowerCase()));
    if (!free.length) document.getElementById('colorField').append(h('p.hint', {}, 'Alle Farben sind schon vergeben. Deine Pings erscheinen grau.'));

    form.onsubmit = (e) => {
      e.preventDefault();
      if (!chosen) return;
      if (free.length && !color) { document.getElementById('msg').textContent = 'Bitte eine Farbe wählen.'; return; }
      sessionStorage.setItem('dnd.join', JSON.stringify({ seat: chosen, playerName: form.elements.playerName.value, pin: form.elements.pin.value, color }));
      location.href = `/player?seat=${chosen}`;
    };
  </script>
</body>
</html>
