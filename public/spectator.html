<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{if(localStorage.getItem("dnd.theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zuschauer – DnD-Tabletop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="spectator">
  <header class="topbar">
    <span class="brand">DnD-Tabletop <small>Zuschauer</small></span>
    <span class="live-info" id="sceneName"></span>
    <span class="spacer"></span>
    <button class="icon" id="zoomOut" title="Verkleinern">−</button>
    <button class="icon" id="zoomFit" title="Ganze Karte">⤢</button>
    <button class="icon" id="zoomIn" title="Vergrößern">+</button>
    <button class="icon" id="fullscreen" title="Vollbild (auch F11)">⛶</button>
    <span id="conn" class="conn" title="Verbindung"></span>
  </header>
  <div id="initiative" class="initiative"></div>
  <main class="layout">
    <div class="board-wrap"><div id="board" class="board"></div></div>
  </main>
  <div id="pinBox" class="login hidden">
    <form class="card" id="pinForm">
      <h1>Zuschauer-Bildschirm</h1>
      <p id="pinMsg">Bitte die Raum-PIN eingeben.</p>
      <label class="field"><span>Raum-PIN</span><input name="pin" inputmode="numeric" autocomplete="off"></label>
      <button class="primary" type="submit">Anzeigen</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/konva.min.js"></script>
  <script type="module" src="/js/spectator.js"></script>
</body>
</html>
